<style>
:root {
  --theme-primary: #0B5FD0;
  --theme-primary-soft: rgba(11, 95, 208, 0.12);
  --free-green: #16A34A;
  --free-green-soft: rgba(22, 163, 74, 0.12);
  --warn-red: #DC2626;
  --warn-red-soft: rgba(220, 38, 38, 0.10);
  --bg-gradient: linear-gradient(180deg, #f5f7fb 0%, #eef2f9 100%);
  --card-bg: rgba(255, 255, 255, 0.72);
  --card-border: rgba(255, 255, 255, 0.6);
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { touch-action: manipulation; overscroll-behavior-y: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-gradient); color: var(--text-primary); min-height: 100vh; line-height: 1.5;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
.app { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }

.navbar {
  position: sticky; top: 0; z-index: 100;
  margin: 0 -16px 16px;
  padding: env(safe-area-inset-top, 12px) 20px 12px;
  background: rgba(245, 247, 251, 0.72);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 0.5px solid rgba(0,0,0,0.06);
}
.navbar h1 { font-size: 17px; font-weight: 700; }

.city-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.city-tab {
  flex: 1; padding: 10px; text-align: center; border-radius: 12px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  font-size: 14px; font-weight: 500; cursor: pointer;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transition: all 0.2s;
}
.city-tab.active { background: var(--theme-primary); color: #fff; border-color: var(--theme-primary); }

.select-card {
  background: var(--card-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--card-border); border-radius: 24px;
  padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.station-row { cursor: pointer; padding: 8px 0; }
.station-row + .station-row { border-top: 1px solid rgba(0,0,0,0.05); margin-top: 8px; }
.station-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.station-name { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.station-tag { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; }
.tag-r { background: rgba(220, 38, 38, 0.1); color: #DC2626; }
.tag-b { background: rgba(11, 95, 208, 0.1); color: #0B5FD0; }
.tag-g { background: rgba(22, 163, 74, 0.1); color: #16A34A; }
.tag-luoyang { background: rgba(245, 158, 11, 0.12); color: #D97706; }
.tag-nanyang { background: rgba(139, 92, 246, 0.12); color: #7C3AED; }
.swap-btn {
  display: block; margin: 4px auto; width: 40px; height: 40px;
  border-radius: 50%; background: var(--theme-primary-soft);
  border: none; color: var(--theme-primary); font-size: 18px;
  cursor: pointer; transition: transform 0.3s;
}
.swap-btn:active { transform: rotate(180deg) scale(0.95); }

.result-card { border-radius: 20px; padding: 18px; margin-bottom: 12px; border: 1px solid; }
.result-warn { background: var(--warn-red-soft); border-color: rgba(220,38,38,0.2); }
.result-free { background: var(--free-green-soft); border-color: rgba(22,163,74,0.2); }
.result-ok { background: var(--free-green-soft); border-color: rgba(22,163,74,0.2); text-align: center; padding: 24px; }
.result-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 12px; }
.result-title { font-size: 18px; font-weight: 700; }
.result-warn .result-title { color: #DC2626; }
.result-free .result-title { color: #16A34A; }
.badge { padding: 6px 12px; border-radius: 10px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.badge-red { background: #DC2626; color: #fff; }
.badge-green { background: #16A34A; color: #fff; }
.result-reason { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.plan-steps { margin-top: 12px; font-size: 14px; line-height: 1.7; }
.plan-steps .step { padding: 4px 0; }
.plan-steps .transfer-note {
  background: rgba(255,255,255,0.6); border-radius: 10px;
  padding: 8px 12px; margin: 6px 0; font-size: 13px;
}
.extra-tip {
  background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245,158,11,0.3);
  border-radius: 14px; padding: 12px 16px; margin-bottom: 12px;
  font-size: 13px; color: #92400E;
}

.action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.action-btn {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 16px; padding: 14px 8px; text-align: center;
  cursor: pointer; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.action-btn .icon { font-size: 22px; margin-bottom: 4px; }
.action-btn .label { font-size: 13px; font-weight: 600; }
.action-btn .desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

.disclaimer { margin-top: 24px; padding: 0 8px; font-size: 11px; color: #9CA3AF; text-align: center; line-height: 1.6; }

/* 站点选择器层级最高（在反向弹窗之上） */
#pickerMask { z-index: 300; }
/* 反向弹窗次之 */
#reverseMask { z-index: 250; }
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  overscroll-behavior: contain;
}
.modal-mask.show { display: flex; align-items: flex-end; }
.modal {
  width: 100%; max-width: 480px; margin: 0 auto;
  background: #fff; border-radius: 24px 24px 0 0;
  max-height: 85vh; display: flex; flex-direction: column;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  padding: 16px 20px; border-bottom: 1px solid #eee;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-header h3 { font-size: 16px; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
.modal-search {
  margin: 12px 16px; padding: 10px 14px;
  border: 1px solid #e5e7eb; border-radius: 12px;
  font-size: 15px; outline: none;
}
.modal-list { overflow-y: auto; padding: 0 16px 20px; flex: 1; }
.group-title { font-size: 12px; color: var(--text-secondary); margin: 12px 0 6px; font-weight: 600; }
.station-option {
  padding: 12px; border-radius: 12px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.station-option:active { background: #f3f4f6; }

/* 反向查询弹窗 */
.reverse-stations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.reverse-chip {
  padding: 8px 12px; border-radius: 10px; font-size: 13px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  cursor: pointer; transition: all 0.15s;
}
.reverse-chip:active { transform: scale(0.96); background: var(--theme-primary-soft); }
.reverse-chip.dim { opacity: 0.6; }
.reverse-group { margin-bottom: 16px; }
.reverse-group h4 { font-size: 14px; margin-bottom: 4px; color: var(--text-secondary); }
.reverse-pick {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}

/* iOS 弹窗 */
.ios-dialog-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 400;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.ios-dialog-mask.show { display: flex; }
.ios-dialog {
  width: 82%; max-width: 340px; background: rgba(255,255,255,0.92);
  border-radius: 16px; overflow: hidden;
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  animation: pop 0.2s ease-out;
}
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ios-dialog-title { padding: 20px 16px 8px; font-size: 16px; font-weight: 700; text-align: center; }
.ios-dialog-msg { padding: 0 16px 20px; font-size: 14px; color: #374151; text-align: center; line-height: 1.7; white-space: pre-wrap; }
.ios-dialog-btns { display: flex; border-top: 0.5px solid rgba(0,0,0,0.1); }
.ios-dialog-btn {
  flex: 1; padding: 13px; text-align: center; font-size: 16px;
  background: none; border: none; cursor: pointer; color: var(--theme-primary);
  font-weight: 500;
}
.ios-dialog-btn + .ios-dialog-btn { border-left: 0.5px solid rgba(0,0,0,0.1); }
.ios-dialog-btn:active { background: rgba(0,0,0,0.06); }
.empty { text-align: center; color: var(--text-secondary); padding: 40px 20px; font-size: 14px; }
.nat-input {
  width: 100%; padding: 12px 14px; border: 1px solid #e5e7eb;
  border-radius: 12px; font-size: 16px; outline: none; background: #fff;
  -webkit-appearance: none; appearance: none;
}
.nat-input:focus { border-color: var(--theme-primary); }
.nat-btn {
  width: 100%; padding: 14px; border: none; border-radius: 14px;
  background: var(--theme-primary); color: #fff; font-size: 16px;
  font-weight: 600; cursor: pointer;
}
.nat-btn:active { opacity: 0.85; }
.nav-row { display: flex; gap: 10px; margin-top: 12px; }
.nav-btn {
  flex: 1; padding: 13px; border-radius: 14px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;

.nav-btn.baidu { background: #306EFF; }
.nav-btn.gaode { background: #00A6A6; }
.nav-btn:active { opacity: 0.85; }

</head>

// 费额估算：一类客车 0.5 元/公里，高速里程按直线距离×1.05
function estimateToll(a, b) {
  if (!a || !b || a.lng == null || b.lng == null) return null;
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  const straight = 2 * R * Math.asin(Math.sqrt(h));
  const km = straight * 1.05;
  return Math.round(km * 0.5);
}

  if (currentCity === 'nanyang') {

function renderStationList() {
  const q = document.getElementById('pickerSearch').value.trim().toLowerCase();
  const list = document.getElementById('modalList');
  let html = '';
  if (currentCity === 'luoyang') {
    const filtered = LY_STATIONS.filter(n => !q || n.includes(q) || n.toLowerCase().includes(q));
    html += '<div class="group-title">洛阳绕城免费站点（豫C）</div>';
    filtered.forEach(n => {
      html += `<div class="station-option" onclick="pickStation({id:'LY_${n}',name:'${n}',cat:'LY'})"><span>${n}</span><span class="station-tag tag-luoyang">免费圈</span></div>`;
    });
  } else if (currentCity === 'nanyang') {
    const filtered = NY_STATIONS.filter(n => !q || n.includes(q) || n.toLowerCase().includes(q));
    html += '<div class="group-title">南阳绕城免费站点（豫R）</div>';
    filtered.forEach(n => {
      html += `<div class="station-option" onclick="pickStation({id:'NY_${n}',name:'${n}',cat:'NY'})"><span>${n}</span><span class="station-tag tag-nanyang">免费圈</span></div>`;
    });
  } else {
    const all = [...R_STATIONS, ...G_STATIONS, ...B_STATIONS];
    const filtered = all.filter(s => !q || s.name.includes(q) || s.short.some(sh => sh.toLowerCase().includes(q)));
    const groups = [
      {title:'红色站点 · 郑州主城体系', list: filtered.filter(s => s.cat === 'R'), tag:'tag-r'},
      {title:'绿色站点 · 换乘节点', list: filtered.filter(s => s.cat === 'G'), tag:'tag-g'},
      {title:'蓝色站点 · 郑开兰体系', list: filtered.filter(s => s.cat === 'B'), tag:'tag-b'},
    ];
    groups.forEach(g => {
      if (g.list.length === 0) return;
      html += `<div class="group-title">${g.title}</div>`;
      g.list.forEach(s => {
        html += `<div class="station-option" onclick='pickStation(${JSON.stringify(s).replace(/'/g, "&#39;")})'><span>${s.name}</span><span class="station-tag ${g.tag}">${s.cat==='R'?'红':s.cat==='G'?'绿':'蓝'}</span></div>`;
      });
    });
  }
  list.innerHTML = html || '<div class="empty">未找到匹配站点</div>';
}

function renderReverse() {
  const area = document.getElementById('reverseResult');
  if (!reverseStart) { area.innerHTML = '<div class="empty">请先选择起点站</div>'; return; }
  const sc = reverseStart.cat;
  let freeTo = [], needTransfer = [];
  if (sc === 'R') {
    freeTo = [...R_STATIONS, ...G_STATIONS];
    needTransfer = B_STATIONS;
  } else if (sc === 'B') {
    freeTo = [...B_STATIONS, ...G_STATIONS];
    needTransfer = R_STATIONS;
  } else {
    freeTo = [...R_STATIONS, ...G_STATIONS, ...B_STATIONS];
  }
  let html = `<div class="reverse-group">
    <h4>✅ 可免费直达（${freeTo.length} 站）</h4>
    <div class="reverse-stations">`;
  freeTo.forEach(s => {
    html += `<span class="reverse-chip" onclick="pickReverseEnd('${s.id}','${s.name}','${s.cat}')">${s.name}</span>`;
  });
  html += `</div></div>`;
  if (needTransfer.length > 0) {
    html += `<div class="reverse-group">
      <h4>⚠️ 需在绿色站中转（${needTransfer.length} 站）</h4>
      <div class="reverse-stations">`;
    needTransfer.forEach(s => {
      html += `<span class="reverse-chip dim" onclick="pickReverseEnd('${s.id}','${s.name}','${s.cat}')">${s.name}</span>`;
    });
    html += `</div></div>`;
  }
  html += `<div style="font-size:12px;color:#9CA3AF;margin-top:8px">点击站点可直接设为终点并计算</div>`;
  area.innerHTML = html;
}

function pickReverseEnd(id, name, cat) {
  endStation = {id, name, cat};
  closeReverseModal();
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
