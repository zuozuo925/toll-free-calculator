<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5FD0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="高速免费避坑">
<title>豫A/豫V 高速免费避坑计算器</title>
<link rel="apple-touch-icon" href="app_icon.png">
<link rel="icon" type="image/png" href="app_icon.png">
<style>
:root {
  --theme-primary: #0B5FD0;
  --theme-primary-soft: rgba(11, 95, 208, 0.12);
  --free-green: #16A34A;
  --free-green-soft: rgba(22, 163, 74, 0.12);
  --warn-red: #DC2626;
  --warn-red-soft: rgba(220, 38, 38, 0.10);
  --bg-gradient: linear-gradient(180deg, #f5f7fb 0%, #eef2f9 100%);
  --card-bg: rgba(255, 255, 255, 0.72);
  --card-border: rgba(255, 255, 255, 0.6);
  --text-primary: #111827;
  --text-secondary: #6B7280;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-gradient);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 16px 40px;
}

/* 顶部导航 */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  margin: 0 -16px 16px;
  padding: env(safe-area-inset-top, 12px) 20px 12px;
  background: rgba(245, 247, 251, 0.72);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 0.5px solid rgba(0,0,0,0.06);
}
.navbar h1 { font-size: 17px; font-weight: 700; }
.navbar .icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--card-bg); border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 18px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* 城市Tab */
.city-tabs {
  display: flex; gap: 8px; margin-bottom: 16px;
}
.city-tab {
  flex: 1; padding: 10px; text-align: center;
  border-radius: 12px; background: var(--card-bg);
  border: 1px solid var(--card-border);
  font-size: 14px; font-weight: 500; cursor: pointer;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.2s;
}
.city-tab.active {
  background: var(--theme-primary); color: #fff;
  border-color: var(--theme-primary);
}

/* 起终点卡片 */
.select-card {
  background: var(--card-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.station-row { cursor: pointer; padding: 8px 0; }
.station-row + .station-row { border-top: 1px solid rgba(0,0,0,0.05); margin-top: 8px; }
.station-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.station-name { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.station-tag {
  display: inline-block; padding: 3px 10px; border-radius: 8px;
  font-size: 12px; font-weight: 500;
}
.tag-r { background: rgba(220, 38, 38, 0.1); color: #DC2626; }
.tag-b { background: rgba(11, 95, 208, 0.1); color: #0B5FD0; }
.tag-g { background: rgba(22, 163, 74, 0.1); color: #16A34A; }
.swap-btn {
  display: block; margin: 4px auto; width: 40px; height: 40px;
  border-radius: 50%; background: var(--theme-primary-soft);
  border: none; color: var(--theme-primary); font-size: 18px;
  cursor: pointer; transition: transform 0.3s;
}
.swap-btn:active { transform: rotate(180deg) scale(0.95); }

/* 结果卡片 */
.result-card {
  border-radius: 20px; padding: 18px; margin-bottom: 12px;
  border: 1px solid;
}
.result-warn {
  background: var(--warn-red-soft); border-color: rgba(220,38,38,0.2);
}
.result-free {
  background: var(--free-green-soft); border-color: rgba(22,163,74,0.2);
}
.result-ok {
  background: var(--free-green-soft); border-color: rgba(22,163,74,0.2);
  text-align: center; padding: 24px;
}
.result-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 8px; gap: 12px;
}
.result-title { font-size: 18px; font-weight: 700; }
.result-warn .result-title { color: #DC2626; }
.result-free .result-title { color: #16A34A; }
.badge {
  padding: 6px 12px; border-radius: 10px;
  font-size: 14px; font-weight: 700; white-space: nowrap;
}
.badge-red { background: #DC2626; color: #fff; }
.badge-green { background: #16A34A; color: #fff; }
.result-reason { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.plan-steps { margin-top: 12px; font-size: 14px; line-height: 1.7; }
.plan-steps .step { padding: 4px 0; }
.plan-steps .step b { color: var(--text-primary); }
.plan-steps .transfer-note {
  background: rgba(255,255,255,0.6); border-radius: 10px;
  padding: 8px 12px; margin: 6px 0; font-size: 13px;
}
.extra-tip {
  background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245,158,11,0.3);
  border-radius: 14px; padding: 12px 16px; margin-bottom: 12px;
  font-size: 13px; color: #92400E;
}

/* 底部功能按钮 */
.action-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-top: 16px;
}
.action-btn {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 16px; padding: 14px 8px; text-align: center;
  cursor: pointer; backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.action-btn .icon { font-size: 22px; margin-bottom: 4px; }
.action-btn .label { font-size: 13px; font-weight: 600; }
.action-btn .desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* 免责声明 */
.disclaimer {
  margin-top: 24px; padding: 0 8px;
  font-size: 11px; color: #9CA3AF; text-align: center; line-height: 1.6;
}

/* 弹窗 - 站点选择器 */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; display: none;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-mask.show { display: flex; align-items: flex-end; }
.modal {
  width: 100%; max-width: 480px; margin: 0 auto;
  background: #fff; border-radius: 24px 24px 0 0;
  max-height: 80vh; display: flex; flex-direction: column;
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  padding: 16px 20px; border-bottom: 1px solid #eee;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-header h3 { font-size: 16px; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
.modal-search {
  margin: 12px 16px; padding: 10px 14px;
  border: 1px solid #e5e7eb; border-radius: 12px;
  font-size: 15px; outline: none;
}
.modal-list { overflow-y: auto; padding: 0 16px 20px; }
.group-title {
  font-size: 12px; color: var(--text-secondary);
  margin: 12px 0 6px; font-weight: 600;
}
.station-option {
  padding: 12px; border-radius: 12px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
}
.station-option:active { background: #f3f4f6; }

/* 主题色面板 */
.theme-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-radius: 24px 24px 0 0;
  padding: 20px; z-index: 300; display: none;
  max-width: 480px; margin: 0 auto;
}
.theme-panel.show { display: block; }
.theme-panel h3 { font-size: 16px; margin-bottom: 16px; }
.theme-row { display: flex; gap: 12px; flex-wrap: wrap; }
.theme-swatch {
  width: 56px; height: 56px; border-radius: 16px; cursor: pointer;
  border: 3px solid transparent; transition: all 0.2s;
}
.theme-swatch.active { border-color: #111827; transform: scale(1.05); }

/* 反向查询结果 */
.reverse-group { margin-bottom: 12px; }
.reverse-group h4 { font-size: 14px; margin-bottom: 8px; color: var(--text-secondary); }
.reverse-stations { display: flex; flex-wrap: wrap; gap: 6px; }
.reverse-chip {
  padding: 6px 12px; border-radius: 10px; font-size: 13px;
  background: var(--card-bg); border: 1px solid var(--card-border);
}
.empty { text-align: center; color: var(--text-secondary); padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <!-- 顶部导航 -->
  <div class="navbar">
    <h1>高速免费避坑</h1>
    <button class="icon-btn" onclick="toggleThemePanel()" title="主题设置">⚙️</button>
  </div>

  <!-- 城市Tab -->
  <div class="city-tabs">
    <div class="city-tab active" data-city="zhengzhou" onclick="switchCity('zhengzhou')">郑州</div>
    <div class="city-tab" data-city="luoyang" onclick="switchCity('luoyang')">洛阳</div>
    <div class="city-tab" data-city="nanyang" onclick="switchCity('nanyang')">南阳</div>
  </div>

  <!-- 起终点选择 -->
  <div class="select-card">
    <div class="station-row" onclick="openPicker('start')">
      <div class="station-label">起点收费站</div>
      <div class="station-name" id="startName">科学大道站</div>
      <span class="station-tag tag-r" id="startTag">属：郑州主城体系</span>
    </div>
    <button class="swap-btn" onclick="swapStations()" title="交换">⇅</button>
    <div class="station-row" onclick="openPicker('end')">
      <div class="station-label">终点收费站</div>
      <div class="station-name" id="endName">开封龙亭站</div>
      <span class="station-tag tag-b" id="endTag">属：郑开兰体系</span>
    </div>
  </div>

  <!-- 结果区 -->
  <div id="resultArea">
    <div class="empty">请选择起点和终点收费站</div>
  </div>

  <!-- 附加政策提示区 -->
  <div id="extraArea"></div>

  <!-- 底部功能 -->
  <div class="action-grid">
    <div class="action-btn" onclick="showReverse()">
      <div class="icon">🔄</div>
      <div class="label">反向查询</div>
      <div class="desc">该站能免费去哪</div>
    </div>
    <div class="action-btn" onclick="showRules()">
      <div class="icon">📋</div>
      <div class="label">规则速查</div>
      <div class="desc">九种组合矩阵</div>
    </div>
    <div class="action-btn" onclick="showAbout()">
      <div class="icon">ℹ️</div>
      <div class="label">关于</div>
      <div class="desc">政策与免责</div>
    </div>
  </div>

  <div class="disclaimer">
    数据核对日期：2026-10-16<br>
    本工具仅供参考，免费政策以交通运输主管部门及收费站现场公示为准。实际扣费以 ETC 记录为准。
  </div>
</div>

<!-- 站点选择器弹窗 -->
<div class="modal-mask" id="pickerMask">
  <div class="modal">
    <div class="modal-header">
      <h3 id="pickerTitle">选择收费站</h3>
      <button class="modal-close" onclick="closePicker()">✕</button>
    </div>
    <input class="modal-search" id="pickerSearch" placeholder="输入站名 / 拼音首字母搜索" oninput="renderStationList()">
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<!-- 主题色面板 -->
<div class="theme-panel" id="themePanel">
  <h3>选择主题色</h3>
  <div class="theme-row" id="themeRow"></div>
</div>

// R类站点到B类站点时的推荐G站（按顺路程度）

  'north': ['G002', 'G003', 'G001'],  // 连霍方向：柳林、东三环北、花园路
  'east': ['G004', 'G005'],            // 郑州新区、圃田

};

let currentPicker = 'start'; // 'start' | 'end'
let startStation = R_STATIONS.find(s => s.id === 'R007'); // 科学大道
let endStation = B_STATIONS.find(s => s.id === 'B005');   // 龙亭

// ============ 主题色 ============
const THEMES = [
  {name:'经典蓝', color:'#0B5FD0'},
  {name:'翡翠绿', color:'#10B981'},
  {name:'樱花粉', color:'#EC4899'},
  {name:'琥珀橙', color:'#F59E0B'},
  {name:'暗夜紫', color:'#8B5CF6'},
];

function initTheme() {
  const saved = localStorage.getItem('theme-color') || '#0B5FD0';
  applyTheme(saved);
  const row = document.getElementById('themeRow');
  row.innerHTML = '';
  THEMES.forEach(t => {
    const sw = document.createElement('div');
    sw.className = 'theme-swatch' + (t.color === saved ? ' active' : '');
    sw.style.background = t.color;
    sw.onclick = () => { applyTheme(t.color); initTheme(); };
    row.appendChild(sw);
  });
}
function applyTheme(color) {
  document.documentElement.style.setProperty('--theme-primary', color);
  document.documentElement.style.setProperty('--theme-primary-soft', color + '20');
  localStorage.setItem('theme-color', color);
}
function toggleThemePanel() {
  document.getElementById('themePanel').classList.toggle('show');
}

// ============ 城市切换 ============
function switchCity(city) {
  currentCity = city;
  document.querySelectorAll('.city-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.city === city);
  });
  if (city === 'luoyang') {
    startStation = {id:'LY01', name: LY_STATIONS[0], cat:'R'};
    endStation = {id:'LY02', name: LY_STATIONS[1], cat:'R'};
  } else if (city === 'nanyang') {
    startStation = {id:'NY01', name: NY_STATIONS[0], cat:'R'};
    endStation = {id:'NY02', name: NY_STATIONS[1], cat:'R'};
  } else {
    startStation = R_STATIONS.find(s => s.id === 'R007');
    endStation = B_STATIONS.find(s => s.id === 'B005');
  }
  render();
}

// ============ 渲染 ============
function catTag(cat) {
  if (cat === 'R') return '<span class="station-tag tag-r">属：郑州主城体系</span>';
  if (cat === 'B') return '<span class="station-tag tag-b">属：郑开兰体系</span>';
  if (cat === 'G') return '<span class="station-tag tag-g">属：绿色换乘节点</span>';
  return '';
}

function render() {
  document.getElementById('startName').textContent = startStation.name;
  document.getElementById('endName').textContent = endStation.name;
  document.getElementById('startTag').outerHTML = catTag(startStation.cat).replace('class="', 'id="startTag" class="');
  document.getElementById('endTag').outerHTML = catTag(endStation.cat).replace('class="', 'id="endTag" class="');
  renderResult();
  renderExtra();
}

function renderResult() {
  const area = document.getElementById('resultArea');
  if (currentCity === 'luoyang') {
    // 洛阳绕城：上下站都在21站内即免费
    const s = LY_STATIONS.includes(startStation.name);
    const e = LY_STATIONS.includes(endStation.name);
    if (s && e) {
      area.innerHTML = '<div class="result-card result-ok"><div class="result-title">🎉 本次通行免费</div><div class="result-reason">上下站均在洛阳绕城免费站点内（豫C ETC 小型客车）</div></div>';
    } else {
      area.innerHTML = `<div class="result-card result-warn"><div class="result-header"><div class="result-title">直接导航：不免费</div></div><div class="result-reason">需上下站均在洛阳绕城 21 个免费站点内才免费。${!s ? '起点"'+startStation.name+'"不在免费站点。' : ''}${!e ? '终点"'+endStation.name+'"不在免费站点。' : ''}</div></div>`;
    }
    return;
  }
  if (currentCity === 'nanyang') {
    const s = NY_STATIONS.includes(startStation.name);
    const e = NY_STATIONS.includes(endStation.name);
    if (s && e) {
      area.innerHTML = '<div class="result-card result-ok"><div class="result-title">🎉 本次通行免费</div><div class="result-reason">上下站均在南阳绕城 7 个免费站点内（豫R ETC 小型客车）</div></div>';
    } else {
      area.innerHTML = `<div class="result-card result-warn"><div class="result-header"><div class="result-title">直接导航：不免费</div></div><div class="result-reason">需上下站均在南阳绕城免费站点内。${!s ? '起点不在免费站点。' : ''}${!e ? '终点不在免费站点。' : ''}</div></div>`;
    }
    return;
  }

  // 郑州主规则
  const sc = startStation.cat, ec = endStation.cat;
  const key = startStation.id + '-' + endStation.id;
  const toll = TOLL[key];

  // 免费矩阵
  const freePairs = [
    ['R','R'], ['R','G'],
    ['B','B'], ['B','G'],
    ['G','R'], ['G','G'], ['G','B'],
  ];
  const isFree = freePairs.some(([a,b]) => a === sc && b === ec);

  if (isFree) {
    area.innerHTML = `<div class="result-card result-ok">
      <div class="result-title">🎉 本次通行免费</div>
      <div class="result-reason">${sc === 'G' ? '绿色换乘节点出发，任意站下均免费' : (sc === ec ? '同体系内通行，政府统缴' : '跨节点通行，政府统缴')}</div>
    </div>`;
    return;
  }

  // 收费场景：R→B 或 B→R
  // 推荐G站
  let recommendGs;
  if (sc === 'R') {
    recommendGs = [RECOMMEND_G.north[0], RECOMMEND_G.north[1]];
  } else {
    recommendGs = [RECOMMEND_G.north[0], RECOMMEND_G.north[1]];
  }
  const gNames = recommendGs.map(gid => {
    const g = G_STATIONS.find(s => s.id === gid);
    return g ? g.name : '';
  });
  const feeText = toll ? `¥${toll}` : '约 ¥30';

  area.innerHTML = `
    <div class="result-card result-warn">
      <div class="result-header">
        <div class="result-title">直接导航走：全程不免费！</div>
        <span class="badge badge-red">预计扣费 ${feeText}</span>
      </div>
      <div class="result-reason">${sc === 'R' ? startStation.name+'不在郑开兰白名单内' : endStation.name+'不在郑开兰白名单内'}，一站直达将触发全程全额扣费。</div>
    </div>
    <div class="result-card result-free">
      <div class="result-header">
        <div class="result-title">推荐免费方案：1 次中转立省 ${feeText.replace('约 ','')}</div>
        <span class="badge badge-green">全程 ¥0 免费</span>
      </div>
      <div class="plan-steps">
        <div class="step">第 1 段：<b>${startStation.name}</b> 上 → <b style="color:#b45309">${gNames.join(' / ')}</b> 下高速（¥0）</div>
        <div class="transfer-note">中转操作：出 ETC 车道后原地掉头，重新刷 ETC 进站（约 2~3 分钟）</div>
        <div class="step">第 2 段：从 <b>${gNames[0]}</b> 上 → 连霍高速 → <b>${endStation.name}</b> 下（¥0）</div>
      </div>
    </div>`;
}

function renderExtra() {
  const area = document.getElementById('extraArea');
  if (currentCity !== 'zhengzhou') { area.innerHTML = ''; return; }
  // 检查是否命中武陟嘉应观补贴
  const sName = startStation.name, eName = endStation.name;
  const hitWZ = (WZ_ZHENGZHOU.includes(sName) && WZ_WUZHI.includes(eName)) ||
                (WZ_ZHENGZHOU.includes(eName) && WZ_WUZHI.includes(sName));
  if (hitWZ) {
    area.innerHTML = `<div class="extra-tip">
      💡 附加政策：该行程符合武陟嘉应观双向补贴条件。豫A/V 7座以下 ETC 小客车，上下站间隔≥2小时，通行费按月补贴返还 ETC 账户。
    </div>`;
  } else {
    area.innerHTML = '';
  }
}

// ============ 站点选择器 ============
function openPicker(type) {
  currentPicker = type;
  document.getElementById('pickerTitle').textContent = type === 'start' ? '选择起点收费站' : '选择终点收费站';
  document.getElementById('pickerMask').classList.add('show');
  document.getElementById('pickerSearch').value = '';
  renderStationList();
}
function closePicker() {
  document.getElementById('pickerMask').classList.remove('show');
}
function renderStationList() {
  const q = document.getElementById('pickerSearch').value.trim().toLowerCase();
  const list = document.getElementById('modalList');
  let html = '';

  if (currentCity === 'luoyang') {
    const filtered = LY_STATIONS.filter(n => !q || n.includes(q) || n.toLowerCase().includes(q));
    html += '<div class="group-title">洛阳绕城免费站点（豫C）</div>';
    filtered.forEach(n => {
      html += `<div class="station-option" onclick="pickStation({id:'LY_${n}',name:'${n}',cat:'R'})"><span>${n}</span><span class="station-tag tag-r">免费圈</span></div>`;
    });
  } else if (currentCity === 'nanyang') {
    const filtered = NY_STATIONS.filter(n => !q || n.includes(q) || n.toLowerCase().includes(q));
    html += '<div class="group-title">南阳绕城免费站点（豫R）</div>';
    filtered.forEach(n => {
      html += `<div class="station-option" onclick="pickStation({id:'NY_${n}',name:'${n}',cat:'R'})"><span>${n}</span><span class="station-tag tag-r">免费圈</span></div>`;
    });
  } else {
    const all = [...R_STATIONS, ...G_STATIONS, ...B_STATIONS];
    const filtered = all.filter(s => {
      if (!q) return true;
      if (s.name.includes(q)) return true;
      return s.short.some(sh => sh.toLowerCase().includes(q));
    });
    const groups = [
      {title:'红色站点 · 郑州主城体系', list: filtered.filter(s => s.cat === 'R'), tag:'tag-r'},
      {title:'绿色站点 · 换乘节点', list: filtered.filter(s => s.cat === 'G'), tag:'tag-g'},
      {title:'蓝色站点 · 郑开兰体系', list: filtered.filter(s => s.cat === 'B'), tag:'tag-b'},
    ];
    groups.forEach(g => {
      if (g.list.length === 0) return;
      html += `<div class="group-title">${g.title}</div>`;
      g.list.forEach(s => {
        html += `<div class="station-option" onclick='pickStation(${JSON.stringify(s).replace(/'/g, "&#39;")})'><span>${s.name}</span><span class="station-tag ${g.tag}">${s.cat==='R'?'红':s.cat==='G'?'绿':'蓝'}</span></div>`;
      });
    });
  }
  list.innerHTML = html || '<div class="empty">未找到匹配站点</div>';
}
function pickStation(s) {
  if (currentPicker === 'start') startStation = s; else endStation = s;
  closePicker();
  render();
}
function swapStations() {
  [startStation, endStation] = [endStation, startStation];
  render();
}

// ============ 反向查询 ============
function showReverse() {
  if (currentCity !== 'zhengzhou') {
    alert('反向查询仅支持郑州体系');
    return;
  }
  const sc = startStation.cat;
  let freeTo = [], needTransfer = [];
  if (sc === 'R') {
    freeTo = [...R_STATIONS, ...G_STATIONS];
    needTransfer = B_STATIONS;
  } else if (sc === 'B') {
    freeTo = [...B_STATIONS, ...G_STATIONS];
    needTransfer = R_STATIONS;
  } else {
    freeTo = [...R_STATIONS, ...G_STATIONS, ...B_STATIONS];
  }
  let html = `<div class="result-card"><div class="result-title" style="font-size:16px;margin-bottom:12px">从 ${startStation.name} 出发：</div>`;
  html += `<div class="reverse-group"><h4>✅ 可免费直达（${freeTo.length} 站）</h4><div class="reverse-stations">`;
  freeTo.slice(0, 30).forEach(s => {
    html += `<span class="reverse-chip">${s.name}</span>`;
  });
  html += `</div></div>`;
  if (needTransfer.length > 0) {
    html += `<div class="reverse-group"><h4>⚠️ 需在 G 站中转一次（${needTransfer.length} 站）</h4><div class="reverse-stations">`;
    needTransfer.slice(0, 20).forEach(s => {
      html += `<span class="reverse-chip" style="opacity:0.7">${s.name}</span>`;
    });
    html += `</div></div>`;
  }
  html += `</div>`;
  document.getElementById('resultArea').innerHTML = html;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

红上 → 红下：免费
红上 → 绿下：免费
蓝上 → 蓝下：免费
蓝上 → 绿下：免费

————
红上 → 蓝下：收费，需在绿站中转
蓝上 → 红下：收费，需在绿站中转`);
}

  alert(`豫A/豫V 高速免费避坑计算器

附加政策：武陟嘉应观补贴、郑新黄河大桥精准补贴、洛阳绕城（豫C）、南阳绕城（豫R）。

实际扣费以 ETC 记录为准。`);

// 初始化
render();
initTheme();
</script>
